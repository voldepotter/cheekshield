<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
  <h1>Complete Your Order</h1>

  <div class="order-protection">
    <label>
      <input type="checkbox" checked> Add Rs 199 order protection
    </label>
  </div>

  <div class="remember">
    <label>
      <input type="checkbox" checked> Remember me
    </label>
  </div>

  <div class="fine-print">
    <span style="font-size:9px; color:#bbb; background:#fff">
      auto-renews at Rs 999/year
    </span>
  </div>

  <div class="actions">
    <button class="primary" style="padding:16px 48px; font-size:18px; background:#ff6600; color:#fff; border:none;">
      Keep my plan
    </button>
    <a href="#" style="font-size:11px; color:#999;">
      No thanks, I don't like saving money
    </a>
  </div>
</body>
</html>
