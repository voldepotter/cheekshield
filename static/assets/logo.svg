  </g>
  <!-- Wordmark -->
  <text x="38" y="24" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" letter-spacing="-0.3px">Cheek<tspan fill="#FF8A3D">Shield</tspan></text>
  <rect x="146" y="11" width="22" height="15" rx="3" fill="#0B0B0B" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="150" y="22" fill="rgba(255,255,255,0.64)" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" letter-spacing="0.5px">AI</text>
</svg>
