    <!-- Stem -->
    <path d="M15 6 C 15 3, 14 1, 13 0" stroke="#7BD389" stroke-width="1.5" stroke-linecap="round" />
    <!-- Peach body -->
    <path d="M15 6 C 10 3, 2 7, 2 17 C 2 26, 8 32, 15 32 C 22 32, 28 26, 28 17 C 28 7, 20 3, 15 6 Z" fill="#FF8A3D" />
