<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Urgency: clock / timer -->
    <g id="glyph-urgency" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7.5" />
      <polyline points="10 6 10 10 13 12" />
    </g>

    <!-- Scarcity: hourglass / shrinking stock -->
    <g id="glyph-scarcity" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 4h10 M5 16h10 M6 4c0 4 4 6 4 6s4-2 4-6 M6 16c0-4 4-6 4-6s4 2 4 6" />
    </g>

    <!-- Social Proof: crowd / multiple figures -->
    <g id="glyph-social-proof" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 16v-1.5a2.5 2.5 0 0 0-2.5-2.5h-5A2.5 2.5 0 0 0 3 14.5V16" />
      <circle cx="8" cy="6.5" r="2.5" />
      <path d="M17 15v-1a2 2 0 0 0-1.5-1.9 M13.5 4.1a2 2 0 0 1 0 3.8" />
    </g>

    <!-- Misdirection: split / diversion arrows -->
    <g id="glyph-misdirection" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="13 4 17 4 17 8" />
      <path d="M17 4l-7 7" />
      <polyline points="3 11 3 16 8 16" />
      <path d="M3 16l6-6" />
    </g>

    <!-- Preselected Choice: pre-ticked checkbox -->
    <g id="glyph-preselected-choice" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="13" height="13" rx="2.5" />
      <polyline points="7 10 9 12.5 13.5 7.5" />
    </g>

    <!-- Disguised Ad: tag / mask -->
    <g id="glyph-disguised-ad" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16.5 9.5l-6-6H4v6.5l6 6 6.5-6.5z" />
      <circle cx="7" cy="7" r="1" fill="currentColor" />
    </g>

    <!-- Other Dark Pattern: warning / flag -->
    <g id="glyph-other" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="10 3 17 16 3 16" />
      <line x1="10" y1="8" x2="10" y2="11.5" />
      <circle cx="10" cy="13.5" r="0.75" fill="currentColor" />
    </g>

    <!-- Fallback glyph: question / neutral node -->
    <g id="glyph-fallback" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7.5" />
      <path d="M8 8a2 2 0 1 1 3 1.7c-.5.4-.9.9-.9 1.8" />
      <circle cx="10" cy="14" r="0.75" fill="currentColor" />
    </g>

    <!-- Leaf tick (clean state mark) -->
    <g id="glyph-leaf-tick" viewBox="0 0 20 20" fill="none" stroke="#7BD389" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 10.5l3.5 3.5 7-8" />
    </g>

    <!-- Checkmark simple -->
    <g id="glyph-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4.5 10 8 13.5 15.5 6" />
    </g>

    <!-- Close / remove -->
    <g id="glyph-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <line x1="5" y1="5" x2="15" y2="15" />
      <line x1="15" y1="5" x2="5" y2="15" />
    </g>

    <!-- Upload icon -->
    <g id="glyph-upload" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5" />
      <path d="M3.5 13v2.5a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V13" />
    </g>

    <!-- Info icon -->
    <g id="glyph-info" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="7.5" />
      <line x1="10" y1="9.5" x2="10" y2="14" />
      <circle cx="10" cy="6.5" r="0.75" fill="currentColor" />
    </g>

    <!-- Chevron down -->
    <g id="glyph-chevron-down" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="5 7.5 10 12.5 15 7.5" />
    </g>

    <!-- Zoom in -->
    <g id="glyph-zoom-in" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="6" />
      <line x1="13.5" y1="13.5" x2="17" y2="17" />
      <line x1="9" y1="6.5" x2="9" y2="11.5" />
      <line x1="6.5" y1="9" x2="11.5" y2="9" />
    </g>

    <!-- Zoom out -->
    <g id="glyph-zoom-out" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="6" />
      <line x1="13.5" y1="13.5" x2="17" y2="17" />
      <line x1="6.5" y1="9" x2="11.5" y2="9" />
    </g>

    <!-- Reset view -->
    <g id="glyph-zoom-reset" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8V4h4 M16 8V4h-4 M4 12v4h4 M16 12v4h-4" />
    </g>
  </defs>
</svg>
